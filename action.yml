name: 'GitHub Issue Enhancer'
description: 'Rewords and formats GitHub issues with Gemini, automates assignees, labels, milestones, branches, and Projects v2.'
author: 'JustJade2007'
branding:
  icon: 'alert-circle'
  color: 'blue'
inputs:
  # --- Authentication ---
  gemini-api-key:
    description: 'Google Gemini API key'
    required: true
  github-token:
    description: 'GitHub token for repository operations (defaults to github.token)'
    required: false
    default: ${{ github.token }}

  # --- Model & Generation ---
  gemini-model:
    description: 'Gemini model name (default: gemini-3.1-flash-lite)'
    required: false
    default: 'gemini-3.1-flash-lite'
  temperature:
    description: 'Sampling temperature between 0.0 and 1.0 (default: 0.2)'
    required: false
    default: '0.2'
  custom-instruction:
    description: 'Custom guidelines or formatting instructions for Gemini'
    required: false
    default: ''

  # --- Formatting & Output ---
  enhance-title:
    description: 'Reword and clarify issue title in addition to body (true/false)'
    required: false
    default: 'false'
  preserve-original:
    description: 'Keep original submission in an expandable details section (true/false)'
    required: false
    default: 'true'
  add-badge:
    description: 'Prepend [!NOTE] enhancement badge to the issue body (true/false)'
    required: false
    default: 'true'
  post-comment:
    description: 'Post contributor fix instructions comment when applicable (true/false)'
    required: false
    default: 'true'

  # --- Filtering & Labels ---
  add-labels:
    description: 'Static labels to apply upon enhancement (comma-separated)'
    required: false
    default: ''
  ignore-authors:
    description: 'Usernames or bots to ignore (comma-separated)'
    required: false
    default: ''
  ignore-labels:
    description: 'Skip enhancement if any of these labels exist (comma-separated)'
    required: false
    default: ''

  # --- Issue Intelligence & Duplicates ---
  close-duplicates:
    description: 'Auto-detect duplicates, apply duplicate label, and close (true/false)'
    required: false
    default: 'true'
  link-related:
    description: 'Detect and cross-reference related repository issues (true/false)'
    required: false
    default: 'true'
  link-dependencies:
    description: 'Detect and link blocking or blocked-by dependencies (true/false)'
    required: false
    default: 'true'
  link-sub-issues:
    description: 'Detect and link parent or sub-issues (true/false)'
    required: false
    default: 'true'

  # --- Assignees, Milestones & Branches ---
  auto-assign:
    description: 'Auto-assign repository owner or maintainers by domain (true/false)'
    required: false
    default: 'false'
  assignees:
    description: 'Specific GitHub usernames to assign (comma-separated)'
    required: false
    default: ''
  milestone:
    description: 'Milestone name, number, or auto to pick best open milestone'
    required: false
    default: ''
  create-branch:
    description: 'Create and link a development branch for this issue (true/false)'
    required: false
    default: 'false'
  branch-prefix:
    description: 'Prefix for created development branches (default: issue-)'
    required: false
    default: 'issue-'

  # --- GitHub Projects v2 ---
  project-url:
    description: 'GitHub Projects v2 URL (e.g. https://github.com/orgs/ORG/projects/1)'
    required: false
    default: ''
  project-token:
    description: 'PAT with project scope for user-owned projects (defaults to github-token)'
    required: false
    default: ''
  project-status-field:
    description: 'Status field name in GitHub Project (default: Status)'
    required: false
    default: 'Status'
  project-initial-status:
    description: 'Initial status for added issues (default: Backlog)'
    required: false
    default: 'Backlog'
  project-priority-field:
    description: 'Priority field name in GitHub Project (default: Priority)'
    required: false
    default: 'Priority'
  project-size-field:
    description: 'Size field name in GitHub Project (default: Size)'
    required: false
    default: 'Size'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Format Issue with Gemini
      shell: bash
      env:
        # Context
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        ISSUE_LABELS: ${{ toJson(github.event.issue.labels) }}
        REPOSITORY: ${{ github.repository }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}

        # Authentication & AI
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        GEMINI_MODEL: ${{ inputs.gemini-model }}
        TEMPERATURE: ${{ inputs.temperature }}
        CUSTOM_INSTRUCTION: ${{ inputs.custom-instruction }}

        # Formatting & Output
        ENHANCE_TITLE: ${{ inputs.enhance-title }}
        PRESERVE_ORIGINAL: ${{ inputs.preserve-original }}
        ADD_BADGE: ${{ inputs.add-badge }}
        POST_COMMENT: ${{ inputs.post-comment }}

        # Filtering & Labels
        ADD_LABELS: ${{ inputs.add-labels }}
        IGNORE_AUTHORS: ${{ inputs.ignore-authors }}
        IGNORE_LABELS: ${{ inputs.ignore-labels }}

        # Intelligence & Duplicates
        CLOSE_DUPLICATES: ${{ inputs.close-duplicates }}
        LINK_RELATED: ${{ inputs.link-related }}
        LINK_DEPENDENCIES: ${{ inputs.link-dependencies }}
        LINK_SUB_ISSUES: ${{ inputs.link-sub-issues }}

        # Assignees, Milestones & Branches
        AUTO_ASSIGN: ${{ inputs.auto-assign }}
        ASSIGNEES: ${{ inputs.assignees }}
        MILESTONE: ${{ inputs.milestone }}
        CREATE_BRANCH: ${{ inputs.create-branch }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}

        # GitHub Projects v2
        PROJECT_URL: ${{ inputs.project-url }}
        PROJECT_TOKEN: ${{ inputs.project-token }}
        PROJECT_STATUS_FIELD: ${{ inputs.project-status-field }}
        PROJECT_INITIAL_STATUS: ${{ inputs.project-initial-status }}
        PROJECT_PRIORITY_FIELD: ${{ inputs.project-priority-field }}
        PROJECT_SIZE_FIELD: ${{ inputs.project-size-field }}
      run: node "${{ github.action_path }}/dist/index.mjs"